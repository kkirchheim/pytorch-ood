[metadata]
name = pytorch-ood
project_name = pytorch-ood
author = Konstantin Kirchheim
contact = konstantin.kirchheim@ovgu.de
keywords = OOD, PyTorch, Out-of-Distribution Detection
version = attr: pytorch_ood.__version__
url = https://github.com/kkirchheim/pytorch-ood
project_urls =
    Bug Tracker = https://github.com/kkirchheim/pytorch-ood/issues
    repository = https://github.com/kkirchheim/pytorch-ood
description = A Library for Out-of-Distribution Detection with PyTorch
long_description = file: README.rst
license = Apache 2.0
license_file = LICENSE
long_description_content_type = text/x-rst
description_file = README.rst
classifiers =
    Programming Language :: Python :: 3
    Operating System :: OS Independent

[options]
# packages = pytorch_ood
packages=find:
package_dir =
    =src
python_requires = >=3.8
include_package_data = True
install_requires =
    torch>=1.7.0
    torchvision>=0.12.0
    scipy>=1.7.0
    numpy>=1.23.0
    # Self (PEP 673) on Python < 3.11
    typing_extensions>=4.0.0

[options.extras_require]
# gdown is lazily imported by library code (dataset downloads); scikit-learn is no longer used
# by the library, but the metric tests use it as a reference
all =
    scikit-learn
    gdown
# only needed to run scripts under examples/, never imported by the library itself
examples =
    optuna
    pandas
    segmentation-models-pytorch

[options.packages.find]
where = src

[options.package_data]
pytorch_ood.dataset.img = resources/*

[tool:pytest]
testpaths = tests
pythonpath = src .
python_files = test_*.py
log_cli = True
markers =
    slow
    hardware(cuda=0, mps=False): needs the given hardware, see tests/helpers/hardware.py
addopts =
    --durations=0
    --strict-markers
    -rs
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning

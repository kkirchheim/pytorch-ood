[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 99
exclude = [".git", "__pycache__", "venv", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "TID251", "TID253", "PT009", "PT027"]
ignore = [
    "F841",  # local variable assigned but never used
    "F403",  # from module import *
    "E501",  # line too long (enforced via line-length)
    "E203",  # whitespace before ':' (conflicts with formatter)
]

# Optional dependencies (extras) must be imported inside the function that uses them, so that a
# plain `pip install pytorch-ood` works; see the minimal-install CI job.
[tool.ruff.lint.flake8-tidy-imports]
banned-module-level-imports = ["sklearn", "gdown", "pandas", "segmentation_models_pytorch"]

# `src.pytorch_ood` is a second copy of the package: exceptions and isinstance checks do not match
# across the two. pytest's `pythonpath = src .` makes `import pytorch_ood` use this checkout.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"src".msg = "import `pytorch_ood`, not `src.pytorch_ood`"

[tool.ruff.lint.per-file-ignores]
# only library code is bound by the install_requires policy
"!src/**" = ["TID253"]
# intentional re-exports
"__init__.py" = ["F401"]
